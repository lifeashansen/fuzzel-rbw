[package]
name = "fuzzel-rbw"
version = "0.1.5"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.47", features = ["derive"] }
duct = "1.1.1"
notify-rust = "4.12.0"
rbw = "1.15.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
which = "8.0.2"
wrtype = "0.1.0"

[[bin]]
name = "frbw"
path = "src/main.rs"

[workspace]
members = [
	".",
	"pinentry-fuzzel",
]
